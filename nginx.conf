# TXAM production nginx configuration for Alibaba Cloud ECS (Hangzhou)
# Nginx serves the public site directly; Node only handles /api/ and /admin/.
# Production Node should bind HOST=127.0.0.1 (see server/.env.example).

upstream txam_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- Optional: enable after TLS certificates are installed ---
# server {
#     listen 80;
#     server_name www.sztxgk.com sztxgk.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl http2;
#     server_name www.sztxgk.com sztxgk.com;
#     ssl_certificate     /etc/nginx/ssl/sztxgk.com.pem;
#     ssl_certificate_key /etc/nginx/ssl/sztxgk.com.key;
#     ssl_session_timeout 1d;
#     ssl_session_cache shared:SSL:10m;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     # Then copy the location blocks from the HTTP server below into this server.
# }

server {
    listen 80;
    server_name www.sztxgk.com sztxgk.com;
    root /var/www/tongxing;
    index index.html;

    sendfile on;
    tcp_nopush on;
    etag on;

    # Text compression. Brotli can be added later when the nginx module is installed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Public API. Public pages are static-data first, so this stays uncached and fresh.
    location /api/ {
        proxy_pass http://txam_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        client_max_body_size 12m;
        add_header Cache-Control "no-store" always;
    }

    location /admin/ {
        proxy_pass http://txam_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    # CMS-generated data must revalidate so publishing changes appear immediately.
    location ^~ /data/ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Self-hosted fonts are versioned assets and can be cached permanently.
    location ^~ /assets/fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ^~ /assets/images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Filenames are not content-hashed yet, so keep code caching conservative.
    location ^~ /assets/css/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /assets/js/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        try_files /assets/images/brand/favicon.png =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML always revalidates so deployments and CMS shell changes are visible.
    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Legacy -en / -ru
    rewrite ^/(.+)-en\.html$ /en/$1.html permanent;
    rewrite ^/(.+)-ru\.html$ /ru/$1.html permanent;

    # Legacy product-N
    rewrite ^/product-(\d+)\.html$ /product-detail.html?id=$1 permanent;
    rewrite ^/product-(\d+)-en\.html$ /en/product-detail.html?id=$1 permanent;
    rewrite ^/product-(\d+)-ru\.html$ /ru/product-detail.html?id=$1 permanent;

    location / {
        try_files $uri $uri/ =404;
    }
}
