# ============================================================
# 同兴高科官网 - Nginx 服务器性能优化配置
# 使用方式：将此文件内容放入 server {} 块中，或 include 引入
# ============================================================

server {
    listen 80;
    listen 443 ssl;
    server_name www.sztxgk.com sztxgk.com;

    root /var/www/tongxing;   # ← 修改为实际部署路径
    index index.html;

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/html
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml;

    # ---------- Brotli（压缩率比 Gzip 高 15-25%，需安装 ngx_brotli 模块）----------
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/html text/css application/javascript image/svg+xml;

    # ---------- 浏览器缓存 ----------
    # 图片 - 1年
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS / JS - 1个月
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    # HTML - 1天（保证内容更新能及时生效）
    location ~* \.html$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- HTTP 跳转 HTTPS ----------
    # 如果已有 HTTPS，取消注释以下段落：
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }
}
