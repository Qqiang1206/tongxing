# TXAM production nginx configuration for Alibaba Cloud ECS (Hangzhou)
# Nginx serves the public site directly; Node only handles /api/ and /admin/.
# Production Node should bind HOST=127.0.0.1 (see server/.env.example).
#
# Deploy: copy nginx.conf and nginx/txam-locations.conf to the server (e.g. /etc/nginx/conf.d/).

upstream txam_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- Step 1 (current): HTTP only — use the server block below. ---
# --- Step 2 (after TLS cert): comment out the HTTP server, uncomment redirect + HTTPS server. ---

# WWW redirect
server {
    listen 80;
    server_name www.sztxgk.com;
    return 301 http://sztxgk.com$request_uri;
}

