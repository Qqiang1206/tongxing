# Shared TXAM site locations — included by HTTP and HTTPS server blocks in nginx.conf.
# Requires: root, index, upstream txam_api already defined in the parent server.

    # Never expose repo internals or upload originals over HTTP.
    location ^~ /_backups/ { deny all; return 404; }
    location ^~ /server/ { deny all; return 404; }
    location ^~ /.git/ { deny all; return 404; }
    location ^~ /node_modules/ { deny all; return 404; }
    location ^~ /_unused-images/ { deny all; return 404; }
    location ^~ /output/ { deny all; return 404; }
    location ^~ /docs/ { deny all; return 404; }
    location ^~ /templates/ { deny all; return 404; }
    location ^~ /nginx/ { deny all; return 404; }
    location ^~ /.zcode/ { deny all; return 404; }
    location ^~ /.playwright-cli/ { deny all; return 404; }
    location ^~ /scripts/ { deny all; return 404; }
    location ^~ /data/schema/ { deny all; return 404; }
    location = /package.json { deny all; return 404; }
    location = /package-lock.json { deny all; return 404; }
    location = /nginx.conf { deny all; return 404; }
    location = /web.config { deny all; return 404; }
    location = /README.md { deny all; return 404; }
    location = /DESIGN.md { deny all; return 404; }
    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type "text/plain; charset=utf-8";
    }
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml; charset=utf-8";
    }
    location ^~ /assets/images/uploads/_originals/ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    # Baseline security headers (HSTS added on HTTPS server only).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Public API. Public pages are static-data first, so this stays uncached and fresh.
    location /api/ {
        proxy_pass http://txam_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        client_max_body_size 12m;
        add_header Cache-Control "no-store" always;
    }

    location /admin/ {
        proxy_pass http://txam_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    # CMS-generated data must revalidate so publishing changes appear immediately.
    # /data/ 仅放行公开内容快照（json/js），其余一律 404
    location ^~ /data/ {
        location ~* ^/data/[^/]+\.(json|js)$ {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-cache";
        }
        return 404;
    }

    # Per-item detail JSON can be cached briefly (content changes invalidate via CMS publish).
    location ~ ^/data/(products|solutions|news)/items/ {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Self-hosted fonts are versioned assets and can be cached permanently.
    location ^~ /assets/fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ^~ /assets/images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Filenames are not content-hashed yet, so keep code caching conservative.
    location ^~ /assets/css/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /assets/js/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        try_files /assets/images/brand/favicon.png =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML always revalidates so deployments and CMS shell changes are visible.
    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Legacy -en / -ru
    rewrite ^/(.+)-en\.html$ /en/$1.html permanent;
    rewrite ^/(.+)-ru\.html$ /ru/$1.html permanent;

    # Legacy product-N
    rewrite ^/product-(\d+)\.html$ /product-detail.html?id=$1 permanent;
    rewrite ^/product-(\d+)-en\.html$ /en/product-detail.html?id=$1 permanent;
    rewrite ^/product-(\d+)-ru\.html$ /ru/product-detail.html?id=$1 permanent;

    location / {
        try_files $uri $uri/ =404;
    }
