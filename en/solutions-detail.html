    <article class="detail-page pt-40 pb-32 px-6 md:px-24">
        <div class="detail-page__inner max-w-[1200px] mx-auto">
            
            <nav class="breadcrumb text-sm text-[#86868B] mb-8 flex items-center flex-wrap" aria-label="Breadcrumb" data-breadcrumb></nav>

            <header class="mb-12 fade-up">
                <div class="flex items-center gap-3 mb-4">
                    <span id="product-category" class="detail-eyebrow text-[#FF6B00] font-bold text-xs tracking-widest uppercase">Solutions</span>
                    <span id="product-model" class="detail-meta-mono"></span>
                </div>
                <h1 id="product-name" class="detail-title hero-title text-h1 text-[#1D1D1F] text-gradient">
                    Solution Name
                </h1>
            </header>

            <div class="detail-hero-grid grid grid-cols-1 lg:grid-cols-2 gap-12 mb-16">
                <div class="fade-up">
                    <div class="media-h-detail w-full media-hero bg-gray-100">
                        <img decoding="async" fetchpriority="high" id="product-image" src="" alt="Solution Image" class="w-full h-full object-cover">
                    </div>
                </div>
                <div class="fade-up">
                    <h3 class="detail-sidebar__label">Core Features</h3>
                    <div id="product-specs" class="detail-specs mb-8">
                    </div>
                    <h3 class="detail-sidebar__label mb-4">Solution Overview</h3>
                    <p id="product-desc" class="detail-lead">
                    </p>
                </div>
            </div>

            <section class="fade-up">
                <h2 class="detail-section__title">Detailed Description</h2>
                <div id="product-detail" class="detail-prose">
                </div>
            </section>

            <section class="detail-related fade-up">
                <h2 class="detail-section__title">Related Solutions</h2>
                <div id="related-products" class="detail-related__grid"></div>
            </section>
        </div>
    </article>

    <div data-footer-placeholder></div>

    <script src="../assets/js/data-loader.js"></script>
    <script src="../assets/js/site-seo.js"></script>
  <script src="../assets/js/site-common.js"></script>
  <script src="../assets/js/site-nav.js"></script>
    <script src="../data/solutions/en.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            var solutionData = {};
            try {
                solutionData = await TXAM.loadData('solutions', 'en');
            } catch (err) {
                console.error(err);
                TXAM.revealFadeUps();
                TXAM.bindMobileMenu();
                return;
            }

            var params = new URLSearchParams(window.location.search);
            var id = params.get('id') || '31';
            var solution = await TXAM.loadCatalogItem('solutions', id, 'en');
            if (!solution) solution = solutionData[id] || solutionData['31'];
            if (!solution) {
                console.error('Solution not found', id);
                TXAM.revealFadeUps();
                TXAM.bindMobileMenu();
                return;
            }

            document.getElementById('product-category').textContent = solution.category;
            document.getElementById('product-model').textContent = solution.model;
            document.getElementById('product-name').textContent = solution.name;
            TXAM.setMedia('product-image', solution.image, solution.name);
            document.getElementById('product-desc').textContent = solution.summary || solution.desc || '';
            document.getElementById('product-detail').innerHTML = solution.contentHtml || solution.detail || '';
            if (TXAM.applySeo) {
                TXAM.applySeo({
                    title: solution.name + ' | TXAM',
                    description: solution.summary || solution.desc || '',
                    image: solution.image,
                    type: 'article'
                });
            } else {
                document.title = solution.name + ' | TXAM';
            }

            var specs = solution.specs || [];
            document.getElementById('product-specs').innerHTML = specs.map(function (spec) {
                return '<span class="spec-tag">' + spec + '</span>';
            }).join('');

            document.getElementById('related-products').innerHTML = Object.keys(solutionData)
                .filter(function (sid) { return sid !== id; })
                .slice(0, 3)
                .map(function (sid) {
                    var s = solutionData[sid];
                    return (
                        '<a href="solutions-detail.html?id=' + sid + '" class="detail-related-card apple-card block p-6 group">' +
                        '<div class="detail-related-card__img w-full h-40 radius-sm overflow-hidden bg-gray-100 mb-4">' +
                        '<img loading="lazy" decoding="async" src="' + TXAM.assetUrl(s.image) + '" alt="' + s.name + '" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">' +
                        '</div>' +
                        '<span class="detail-related-card__eyebrow">' + (s.model || '') + '</span>' +
                        '<h4 class="detail-related-card__title mt-1">' + s.name + '</h4>' +
                        '</a>'
                    );
                }).join('');

            TXAM.revealFadeUps();
            TXAM.bindMobileMenu();
        });
    </script>
    <script src="../data/i18n/en.js"></script>
